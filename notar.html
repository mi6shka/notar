<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Переписка и нотариальный осмотр</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #fff;
  color: #36323c;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.55;
}

.interactive {
  max-width: 760px;
  margin: 0 auto;
}

.card {
  padding: 28px 30px;

  background: #F7F5FF;
  border: 1px solid #d8d3e8;
  border-radius: 20px;

  animation: turn .28s ease;
}

.kicker {
  margin: 0 0 5px;

  color: #625b9b;
  font-size: 13px;
  font-weight: 700;
}

h2 {
  margin: 0;

  color: #625b9b;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 700;
}

h3 {
  margin: 5px 0 0;

  color: #625b9b;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 700;
}

p {
  margin: 10px 0 0;

  font-size: 15px;
  line-height: 1.55;
}

.intro {
  font-size: 15px;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;

  margin-top: 22px;
}

button {
  font-family: Arial, Helvetica, sans-serif;
  cursor: pointer;
}

.choice {
  min-height: 50px;
  padding: 11px 17px;

  border: 0;
  border-radius: 25px;

  background: #A49BFF;
  color: #292733;

  font-size: 14px;
  font-weight: 700;
  text-align: center;

  transition: background-color .2s ease;
}

.choice:hover {
  background: #968CF4;
}

.choice:focus-visible,
.back:focus-visible {
  outline: 2px solid #625b9b;
  outline-offset: 3px;
}

.risk {
  margin-top: 21px;
  padding-left: 15px;

  border-left: 3px solid #8f87c7;
}

.risk-title,
.section-title {
  color: #36323c;
  font-size: 15px;
  font-weight: 700;
}

.requisites {
  margin-top: 9px;

  color: #55505f;
  font-size: 13px;
  font-weight: 700;
}

.divider {
  margin-top: 21px;
  padding-top: 16px;

  border-top: 1px solid #d3cee5;
}

.back {
  min-height: 44px;
  margin-top: 22px;
  padding: 10px 19px;

  border: 0;
  border-radius: 22px;

  background: #A49BFF;
  color: #292733;

  font-size: 14px;
  font-weight: 700;

  transition: background-color .2s ease;
}

.back:hover {
  background: #968CF4;
}

@keyframes turn {
  from {
    opacity: .35;
    transform: rotateY(8deg);
  }

  to {
    opacity: 1;
    transform: rotateY(0);
  }
}

@media (max-width: 600px) {
  .card {
    padding: 23px 21px;
  }

  .choices {
    grid-template-columns: 1fr;
  }

  h2 {
    font-size: 20px;
  }

  h3 {
    font-size: 19px;
  }

  p {
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
  }
}
</style>
</head>

<body>

<main
  class="interactive"
  id="interactive"
  aria-live="polite">
</main>

<script>
const root = document.getElementById('interactive');


const front = `
<section class="card">

  <p class="kicker">
    Выберите свою ситуацию
  </p>

  <h2>
    Переписку зафиксировали у нотариуса?
  </h2>

  <p class="intro">
    Нажмите на вариант, чтобы узнать о рисках.
  </p>

  <div class="choices">

    <button
      class="choice"
      type="button"
      data-view="no">
      Нет, нотариального протокола нет
    </button>

    <button
      class="choice"
      type="button"
      data-view="yes">
      Да, переписку осмотрел нотариус
    </button>

  </div>

</section>
`;


const no = `
<section class="card">

  <p class="kicker">
    Нотариального протокола нет
  </p>

  <h3>
    Есть два основных риска
  </h3>

  <div class="risk">

    <div class="risk-title">
      1. Исходные сообщения позднее не получится проверить
    </div>

    <p>
      Можно потерять доступ к сервису, аккаунту или самим
      сообщениям. Если останутся только изображения экрана,
      суду может не хватить данных, чтобы проверить
      доказательство.
    </p>

    <p>
      <strong>Из практики.</strong>
      Суд признал фотографии экрана программы недопустимыми
      доказательствами: на них не было даты и точного времени,
      а проверить материалы непосредственно в программе уже
      было невозможно, поскольку сервис Canva закрыл доступ
      для пользователей из России.
    </p>

    <p class="requisites">
      Постановление Тринадцатого ААС от 25.06.2024
      по делу № А56-93605/2023
    </p>

  </div>


  <div class="risk">

    <div class="risk-title">
      2. Оппонент заявит, что переписку изменили
    </div>

    <p>
      Оппонент может сослаться на правки и потребовать
      исключить скриншоты из доказательств. Если первоначальный
      вид сообщений нельзя проверить, такой довод создает
      дополнительный риск.
    </p>

    <p>
      <strong>Из практики.</strong>
      Суд не принял скриншоты переписки, поскольку отсутствие
      нотариального заверения не позволяло убедиться, что
      сообщения представлены в первоначальном виде и их
      не корректировали.
    </p>

    <p class="requisites">
      Решение Первомайского районного суда г. Владивостока
      от 27.08.2025 по делу № 12-93/2025
    </p>

  </div>


  <div class="divider">

    <div class="section-title">
      Что сделать
    </div>

    <p>
      Если исходная переписка еще доступна, зафиксируйте ее
      заранее. Нотариальный осмотр поможет сохранить содержание
      сообщений и снизить риск спора об их первоначальном виде.
    </p>

  </div>

  <button class="back" type="button">
    ← Вернуться к выбору
  </button>

</section>
`;


const yes = `
<section class="card">

  <p class="kicker">
    Нотариальный протокол есть
  </p>

  <h3>
    Даже нотариальный осмотр может не помочь
  </h3>

  <p>
    Нотариальный протокол подтверждает содержание
    зафиксированной переписки, но сам по себе не доказывает,
    что сторона надлежащим образом исполнила договор.
  </p>

  <div class="risk">

    <div class="risk-title">
      Когда возникнет проблема
    </div>

    <p>
      Если из самих сообщений не следует нужный юридический
      факт или сторона нарушила предусмотренный договором
      порядок действий, нотариальная фиксация этого не исправит.
    </p>

  </div>


  <div class="divider">

    <div class="section-title">
      Из практики
    </div>

    <p>
      Покупатель утверждал, что вернул поставщику некачественный
      товар, и представил нотариальный протокол осмотра смартфона
      сотрудника с перепиской сторон. Однако переписка не
      подтверждала фактический возврат товара, а установленную
      договором процедуру его приемки и возврата покупатель
      не соблюдал. Суды взыскали с него 1,67 млн руб.
      задолженности.
    </p>

    <p class="requisites">
      Постановление АС Северо-Западного округа от 24.06.2025
      по делу № А56-82992/2023
    </p>

  </div>

  <button class="back" type="button">
    ← Вернуться к выбору
  </button>

</section>
`;


function render(html) {

  root.innerHTML = html;

  root.querySelectorAll('[data-view]').forEach(button => {

    button.addEventListener('click', () => {

      if (button.dataset.view === 'no') {
        render(no);
      } else {
        render(yes);
      }

    });

  });

  const backButton = root.querySelector('.back');

  if (backButton) {
    backButton.addEventListener('click', () => {
      render(front);
    });
  }
}

render(front);
</script>

</body>
</html>
